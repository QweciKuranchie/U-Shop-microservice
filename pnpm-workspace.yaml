packages:
  - "apps/*"
  - "packages/*"
  - "studio"

allowBuilds:
  '@clerk/shared': true
  '@firebase/util': true
  bufferutil: true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  nx: true

minimumReleaseAgeExclude:
  - '@babel/helper-create-regexp-features-plugin@7.29.10'
  - '@babel/helpers@7.29.10'
  - '@babel/runtime@7.29.10'
  - '@babel/traverse@7.29.10'
  - '@codemirror/language@6.13.1'
  - '@codemirror/streamparser@6.0.0'
  - '@codemirror/view@6.43.14'
  - '@lezer/lr@1.4.11'
  - '@rollup/rollup-android-arm-eabi@4.64.2'
  - '@rollup/rollup-android-arm64@4.64.2'
  - '@rollup/rollup-darwin-arm64@4.64.2'
  - '@rollup/rollup-darwin-x64@4.64.2'
  - '@rollup/rollup-freebsd-arm64@4.64.2'
  - '@rollup/rollup-freebsd-x64@4.64.2'
  - '@rollup/rollup-linux-arm-gnueabihf@4.64.2'
  - '@rollup/rollup-linux-arm-musleabihf@4.64.2'
  - '@rollup/rollup-linux-arm64-gnu@4.64.2'
  - '@rollup/rollup-linux-arm64-musl@4.64.2'
  - '@rollup/rollup-linux-loong64-gnu@4.64.2'
  - '@rollup/rollup-linux-loong64-musl@4.64.2'
  - '@rollup/rollup-linux-ppc64-gnu@4.64.2'
  - '@rollup/rollup-linux-ppc64-musl@4.64.2'
  - '@rollup/rollup-linux-riscv64-gnu@4.64.2'
  - '@rollup/rollup-linux-riscv64-musl@4.64.2'
  - '@rollup/rollup-linux-s390x-gnu@4.64.2'
  - '@rollup/rollup-linux-x64-gnu@4.64.2'
  - '@rollup/rollup-linux-x64-musl@4.64.2'
  - '@rollup/rollup-openbsd-x64@4.64.2'
  - '@rollup/rollup-openharmony-arm64@4.64.2'
  - '@rollup/rollup-win32-arm64-msvc@4.64.2'
  - '@rollup/rollup-win32-ia32-msvc@4.64.2'
  - '@rollup/rollup-win32-x64-gnu@4.64.2'
  - '@rollup/rollup-win32-x64-msvc@4.64.2'
  - electron-to-chromium@1.5.451
  - rollup@4.64.2
  - tldts-core@7.4.18
  - tldts@7.4.18
  - update-browserslist-db@1.3.4
  - '@shadcn/registry@0.1.3'
  - '@supabase/auth-js@2.117.3'
  - '@supabase/functions-js@2.117.3'
  - '@supabase/postgrest-js@2.117.3'
  - '@supabase/realtime-js@2.117.3'
  - '@supabase/storage-js@2.117.3'
  - '@supabase/supabase-js@2.117.3'
  - 'shadcn@4.21.4'

overrides:
  sharp: '>=0.35.0'
  postcss: '8.5.23'
  js-cookie: '>=3.0.7'
  eslint: '9.21.0'
  # Security overrides — force patched versions of vulnerable transitive deps
  next: '>=16.3.6'
  axios: '>=1.20.0'
  'jsdom>undici': '>=6.28.1 <7'
  undici: '>=7.29.1'
  fast-uri: '>=3.1.4'
  nanoid: '>=5.1.0'
  js-yaml: '>=4.3.1'
  brace-expansion: '>=5.0.12'
  browserslist: '>=4.28.7'
  adm-zip: '>=0.6.0'
  dompurify: '>=3.4.13'
  prismjs: '>=1.30.0'
  qs: '>=6.15.4'
  uuid: '>=10.0.0'
  smol-toml: '>=1.7.1'
  tar: '>=7.5.21'
  image-size: '>=2.0.3'
  markdown-it: '>=14.3.1'
  '@grpc/grpc-js': '>=1.13.6'
  '@eslint/plugin-kit': '>=0.3.4'
  serialize-javascript: '>=7.1.2'

peerDependencyRules:
  allowAny:
    - utf-8-validate
