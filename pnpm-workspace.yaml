packages:
  - "apps/*"
  - "packages/*"
  - "studio"

allowBuilds:
  '@clerk/shared': true
  '@firebase/util': true
  bufferutil: true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  nx: true

overrides:
  sharp: '>=0.35.0'
  postcss: '8.5.23'
  js-cookie: '>=3.0.7'
  eslint: '9.21.0'
  # Security overrides — force patched versions of vulnerable transitive deps
  next: '>=16.3.6'
  axios: '>=1.20.0'
  undici: '>=7.29.1'
  fast-uri: '>=3.1.4'
  nanoid: '>=5.1.0'
  js-yaml: '>=4.3.1'
  brace-expansion: '>=5.0.12'
  browserslist: '>=4.28.7'
  adm-zip: '>=0.6.0'
  dompurify: '>=3.4.13'
  prismjs: '>=1.30.0'
  qs: '>=6.15.4'
  uuid: '>=10.0.0'
  smol-toml: '>=1.7.1'
  tar: '>=7.5.21'
  image-size: '>=2.0.3'
  markdown-it: '>=14.3.1'
  '@grpc/grpc-js': '>=1.13.6'
  '@eslint/plugin-kit': '>=0.3.4'
  serialize-javascript: '>=7.1.2'

peerDependencyRules:
  allowAny:
    - utf-8-validate

