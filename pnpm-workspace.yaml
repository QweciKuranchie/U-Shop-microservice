packages:
  - "apps/*"
  - "packages/*"
  - "studio"

allowBuilds:
  '@clerk/shared': true
  '@firebase/util': true
  bufferutil: true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  nx: true

overrides:
  sharp: '>=0.35.0'
  postcss: '8.5.23'
  js-cookie: '>=3.0.7'
  eslint: '9.21.0'
  # Security overrides — force patched versions of vulnerable transitive deps
  undici: '>=7.29.1'
  fast-uri: '>=3.0.6'
  nanoid: '>=5.1.0'
  js-yaml: '>=4.1.1'
  brace-expansion: '>=2.0.2'
  browserslist: '>=4.25.0'
  adm-zip: '>=0.5.16'
  dompurify: '>=3.2.5'
  prismjs: '>=1.30.0'
  qs: '>=6.13.1'
  uuid: '>=10.0.0'
  smol-toml: '>=1.3.4'

